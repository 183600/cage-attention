[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-attention"
version = "0.1.0"
description = "Calibrated gated attention: reproducible synthetic-experiment harness"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["cage", "cage.experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Keep the default check set conservative: the package predates an
# auto-formatter, so the gate should catch real defects (syntax, undefined
# names, import errors) without a style-only rewrite.
select = ["E4", "E7", "E9", "F"]
